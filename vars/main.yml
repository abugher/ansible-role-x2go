---
os_alias:                       "{{ 'raspbian' if 'raspberry-pi' == hostvars[inventory_hostname]['platform'] else 'debian' }}"
keyring_file:                   '/usr/share/keyrings/x2go.org.asc'
components:
  - 'main'
  - 'extras'

install_files:
# Key fingerprint from:
# https://wiki.x2go.org/doku.php/wiki:repositories:debian
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/conf/x2go.org.asc'
    dest:                       "{{ keyring_file }}"
template_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/x2go.org.sources.j2'
    dest:                       '/etc/apt/sources.list.d/x2go.org.sources'
install_packages:
  #- 'nxagent'
  #- 'x2goserver-x2goagent'
  - 'x2goserver'
  - 'x2goserver-xsession'
enable_services:
  - 'x2goserver'
start_services:
  - 'x2goserver'
